<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>搭子自习</title>
<style>
:root{--bg:#f8f5f2;--card:#fff;--or:#f59a0c;--tx:#222;--mu:#999;--bl:#3b82f6;--ln:#eee}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"PingFang SC","Noto Sans SC",sans-serif}
#app{max-width:560px;margin:auto;height:100%;display:flex;flex-direction:column;position:relative;padding-top:env(safe-area-inset-top)}
.top{display:flex;justify-content:center;gap:22px;padding:14px 8px 6px;overflow-x:auto}
.top a{font-size:18px;color:#555;padding-bottom:4px;white-space:nowrap;cursor:pointer}
.top a.on{color:#000;font-weight:700;border-bottom:3px solid #000}
.main{flex:1;overflow:auto;padding:8px 12px 110px;display:flex;gap:8px}
.side{display:flex;flex-direction:column;gap:14px;padding-top:10px;width:26px;flex:none}
.side a{writing-mode:vertical-rl;letter-spacing:4px;color:#aaa;font-size:14px;cursor:pointer;margin:auto 0}
.side a.on{color:#000;font-weight:700}
.col{flex:1;min-width:0}
.card{background:var(--card);border-radius:22px;padding:14px;margin:10px 0;box-shadow:0 1px 6px #0000000a}
h4{margin:14px 4px 4px;font-size:15px}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}
.mu{color:var(--mu);font-size:13px}.or{color:var(--or)}.bl{color:var(--bl);cursor:pointer}
.days{display:flex;justify-content:space-between;text-align:center;margin:6px 0}
.days div{flex:1;cursor:pointer;color:#bbb;font-size:12px}
.days b{display:block;width:34px;height:34px;line-height:34px;border-radius:50%;margin:3px auto;font-size:17px;font-weight:400;color:#333}
.days .on b{background:var(--or);color:#fff}.days .td b{background:#cdd6ea}
.pie{width:220px;display:block;margin:6px auto}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:10px}
.leg div{display:grid;grid-template-columns:14px 1fr auto;gap:2px 6px;align-items:center;font-size:13px}
.leg i{width:12px;height:12px;border-radius:50%;grid-row:span 2}.leg span{grid-column:2;color:var(--mu)}.leg em{grid-row:1/3;grid-column:3;font-style:normal;color:var(--mu)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:5px 0}
.chk input{width:20px;height:20px;accent-color:#888;margin-top:2px}
.chk.d span{color:#999}
.btn{border:1px solid var(--or);color:var(--or);background:#fff;border-radius:12px;padding:5px 12px;cursor:pointer;font-size:14px}
.btn.f{background:var(--or);color:#fff}
.hab{display:flex;align-items:center;gap:12px;background:#fff;border-radius:26px;padding:10px 16px;margin:8px 0}
.hab.dn{background:#fbe95e}
.ic{width:42px;height:42px;border-radius:50%;background:#e0a24a;color:#fff;display:grid;place-items:center;font-weight:700}
.ok{width:28px;height:28px;border-radius:50%;background:#35b86a;color:#fff;display:grid;place-items:center}
.nav{position:absolute;bottom:0;left:0;right:0;display:flex;background:#f8f5f2f2;padding:8px 0 calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--ln)}
.nav a{flex:1;text-align:center;font-size:12px;color:#888;cursor:pointer}.nav a b{display:block;font-size:22px}.nav a.on{color:var(--or)}
.fab{position:absolute;right:14px;bottom:calc(86px + env(safe-area-inset-bottom));width:74px;height:74px;border-radius:50%;background:var(--or);color:#fff;border:0;font-size:15px;line-height:1.3;box-shadow:0 6px 16px #f59a0c66;cursor:pointer;z-index:5}
.empty{text-align:center;color:var(--mu);padding:22px 8px}
.pill{border:1px solid #ccc;border-radius:12px;font-size:12px;padding:0 8px;color:#888}
.dot{width:10px;height:10px;border-radius:50%;background:#aab;display:inline-block}.dot.live{background:var(--or)}
.av{width:52px;height:52px;border-radius:50%;background:#3b82f6;color:#fff;display:grid;place-items:center;font-size:20px;overflow:hidden;flex:none}.av img{width:100%;height:100%;object-fit:cover}
#m{position:fixed;inset:0;display:none;background:#0006;z-index:20;align-items:flex-end;justify-content:center}
#m.s{display:flex}.sheet{background:#fff;width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:88%;overflow:auto}
.sheet input,.sheet textarea,.sheet select{width:100%;padding:10px;border:1px solid #ddd;border-radius:12px;font:inherit;margin:4px 0 10px;background:#fff}
.sheet textarea{min-height:130px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.tags span{padding:6px 14px;border-radius:16px;background:#f1ede8;cursor:pointer}.tags span.on{background:var(--or);color:#fff}
.timer{font-size:56px;text-align:center;font-weight:300;margin:20px 0;font-variant-numeric:tabular-nums}
.login{margin:auto;text-align:center;padding:30px}.login h1{font-size:30px;margin:0 0 6px}
.msgs{height:50vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
.msg{max-width:75%;padding:7px 12px;border-radius:14px;background:#f1ede8;align-self:flex-start}.msg.me{background:#ffe3ac;align-self:flex-end}
.bar{height:8px;background:#eee;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--or)}
</style></head><body>
<div id="app"></div><div id="m"></div>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyBaiSjLnTaVhLdwfsNA2Teb-8y5ITeBQfc",authDomain:"english-pairing-5786e.firebaseapp.com",databaseURL:"https://english-pairing-5786e-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"english-pairing-5786e",storageBucket:"english-pairing-5786e.firebasestorage.app",messagingSenderId:"673981745505",appId:"1:673981745505:web:863a0994ef718536505d20"});
const auth=firebase.auth(),db=firebase.database();
const PAL=['#c99695','#e8d5c9','#e2d3e2','#e2bfc3','#a5a5a5','#ddd2d0','#c78a87'];
const ymd=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const addD=(d,n)=>{d=new Date(d);d.setDate(d.getDate()+n);return d};
const mon=d=>addD(d,-((new Date(d).getDay()+6)%7));
const fmt=s=>{s=Math.round(s/60);const h=Math.floor(s/60),m=s%60;return h?h+'时'+m+'分':m+'分'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const WD=['一','二','三','四','五','六','日'];
const S={u:null,tab:'study',sub:'board',bs:'day',date:ymd(new Date()),d:{},prof:{},fr:[],ps:'mine',os:'mine',fs:'friends',fd:{},timer:null};
let ref,unsub=[];
const wk=()=>ymd(mon(new Date()));
const me=()=>S.u.uid;
const list=o=>Object.entries(o||{}).map(([id,v])=>({id,...v}));

auth.onAuthStateChanged(u=>{S.u=u;unsub.forEach(f=>f());unsub=[];
 if(!u){render();return}
 ref=db.ref('users/'+u.uid);
 db.ref('profiles/'+u.uid).update({name:u.displayName||u.email,photo:u.photoURL||'',last:Date.now()});
 const a=ref.on('value',s=>{S.d=s.val()||{};render()});unsub.push(()=>ref.off('value',a));
 const f=db.ref('friends/'+u.uid);const b=f.on('value',s=>{S.fr=Object.keys(s.val()||{});loadF()});unsub.push(()=>f.off('value',b));
 const r=db.ref('interactions/'+u.uid).limitToLast(30);const c=r.on('value',s=>{S.inter=list(s.val()).reverse();render()});unsub.push(()=>r.off('value',c));
});
async function loadF(){const ids=S.fr;const o={};
 await Promise.all(ids.map(async id=>{const [p,pl,g]=await Promise.all([db.ref('profiles/'+id).get(),db.ref('users/'+id+'/plans').limitToLast(3).get(),db.ref('users/'+id+'/goals').get()]);o[id]={p:p.val()||{},plans:pl.val()||{},goals:g.val()||{}}}));
 S.fd=o;render()}

/* ---------- helpers ---------- */
function sess(from,to){return list(S.d.sessions).filter(s=>s.date>=from&&s.date<=to)}
function byTag(arr){const m={};arr.forEach(s=>m[s.tag]=(m[s.tag]||0)+s.secs);return m}
function pie(m,donut){const e=Object.entries(m).sort((a,b)=>b[1]-a[1]),T=e.reduce((a,b)=>a+b[1],0);
 if(!T)return '<div class="empty">还没有专注记录，点右下角「开始专注」</div>';
 let a=-Math.PI/2,p='';
 e.forEach(([k,v],i)=>{const f=v/T,b=a+f*2*Math.PI,c=PAL[i%PAL.length];
  p+=f>.999?`<circle r="1" fill="${c}"/>`:`<path d="M0 0L${Math.cos(a)} ${Math.sin(a)}A1 1 0 ${f>.5?1:0} 1 ${Math.cos(b)} ${Math.sin(b)}Z" fill="${c}"/>`;a=b});
 if(donut)p+=`<circle r=".42" fill="#fff"/><text y=".08" font-size=".2" text-anchor="middle" font-weight="700">${fmt(T)}</text>`;
 return `<svg viewBox="-1 -1 2 2" class="pie">${p}</svg><div class="leg">${e.map(([k,v],i)=>`<div><i style="background:${PAL[i%PAL.length]}"></i><b>${esc(k)}</b><span>${fmt(v)}</span><em>${Math.round(v/T*100)}%</em></div>`).join('')}</div>`}
function weekStrip(key,fn){const st=mon(S.date);return `<div class="row"><b class="bl" onclick="A.shift(-7)">‹</b><b>${new Date(S.date).getMonth()+1}月${new Date(S.date).getDate()}日 周${WD[(new Date(S.date).getDay()+6)%7]}</b><b class="bl" onclick="A.shift(7)">›</b></div>
<div class="days">${WD.map((w,i)=>{const d=ymd(addD(st,i));return `<div class="${d===S.date?'on':''} ${d===ymd(new Date())?'td':''}" onclick="A.setDate('${d}')">${w}<b>${new Date(d).getDate()}</b></div>`}).join('')}</div>`}
function streak(h){const c=S.d.checks||{};let n=0,d=new Date();if(!(c[ymd(d)]||{})[h])d=addD(d,-1);while((c[ymd(d)]||{})[h]){n++;d=addD(d,-1)}return n}
function plan(date){return (S.d.plans||{})[date]}

/* ---------- views ---------- */
function vBoard(){
 const side=[['day','日活动'],['week','周统计'],['rec','录音'],['rank','榜单']];
 let b='';
 if(S.bs==='day'){const ss=sess(S.date,S.date),T=ss.reduce((a,s)=>a+s.secs,0),hs=list(S.d.habits),ck=(S.d.checks||{})[S.date]||{},p=plan(S.date);
  b=`${weekStrip()}<h4>日专注：<u>${fmt(T)}</u></h4><div class="card">${pie(byTag(ss))}</div>
  <h4>日习惯：打卡${hs.filter(h=>ck[h.id]).length}个</h4><div class="card row" style="overflow:auto">${hs.length?hs.map(h=>`<div style="text-align:center;min-width:56px;cursor:pointer;color:${ck[h.id]?'#35b86a':'#aaa'}" onclick="A.check('${h.id}','${S.date}')"><div style="font-size:22px">${ck[h.id]?'✔':'○'}</div><div class="mu">${esc(h.name)}</div></div>`).join(''):'<span class="empty">去「小习惯」添加习惯</span>'}</div>
  <h4>日计划及总结：</h4>${planCard(S.date,p,true)}`}
 if(S.bs==='week'){const st=mon(S.date),a=ymd(st),z=ymd(addD(st,6)),ss=sess(a,z),hs=list(S.d.habits).filter(h=>h.freq==='day'),ck=S.d.checks||{};
  let done=0;for(let i=0;i<7;i++)hs.forEach(h=>{if((ck[ymd(addD(st,i))]||{})[h.id])done++});const rate=hs.length?Math.round(done/(hs.length*7)*100):0;
  b=`<div class="row"><b class="bl" onclick="A.shift(-7)">‹</b><b>${a.slice(5).replace('-','.')} - ${z.slice(5).replace('-','.')}</b><b class="bl" onclick="A.shift(7)">›</b></div>
  <h4>周习惯打卡统计：</h4><div class="card row" style="justify-content:space-around;text-align:center"><div><div class="or" style="font-size:34px;font-weight:700">${done}次</div>周打卡</div><div><div class="or" style="font-size:34px;font-weight:700">${rate}%</div>周完成率</div></div>
  <h4>周专注时间统计：</h4><div class="card">${pie(byTag(ss),1)}</div>`}
 if(S.bs==='rec')b=`<div class="card empty">录音功能需要开启 Firebase Storage 后接入。<br>目前可先使用专注计时记录学习时间。</div>`;
 if(S.bs==='rank'){const rows=[{id:me(),p:{name:S.u.displayName,photo:S.u.photoURL,...(S.prof[me()]||{})}}].concat(S.fr.map(id=>({id,p:(S.fd[id]||{}).p||{}})));
  const val=p=>p.weekKey===wk()?p.weekSecs||0:0;
  const mine=rows[0];mine.p=Object.assign({},mine.p,S.myp||{});
  rows.sort((a,b)=>val(b.p)-val(a.p));
  b=`<h4>本周专注榜</h4>${rows.map((r,i)=>`<div class="card row"><b style="width:24px">${i+1}</b>${av(r.p)}<b>${esc(r.p.name||'未命名')}${r.id===me()?'（我）':''}</b><span class="sp"></span><span class="or">${fmt(val(r.p))}</span></div>`).join('')}`}
 return `<div class="side">${side.map(([k,n])=>`<a class="${S.bs===k?'on':''}" onclick="A.set('bs','${k}')">${n}</a>`).join('')}</div><div class="col">${b}</div>`}
function av(p){return `<div class="av">${p.photo?`<img src="${esc(p.photo)}" referrerpolicy="no-referrer">`:esc((p.name||'?')[0])}</div>`}
function planCard(date,p,own,fid){
 const items=p?(p.items||[]):[];
 return `<div class="card"><div class="row mu"><span>🔒 搭友可见</span><span class="sp"></span>${own?`<span class="bl" onclick="A.editPlan('${date}')">编辑</span>`:''}</div>
 ${items.length?items.map((it,i)=>`<label class="chk ${it.done?'d':''}"><input type="checkbox" ${it.done?'checked':''} ${own?`onchange="A.tick('${date}',${i})"`:'disabled'}><span>${esc(it.t)}</span></label>`).join(''):`<div class="empty">${own?'还没有计划，点「编辑」写下今天要做的事（每行一项）':'没有计划'}</div>`}
 <div class="row mu" style="margin-top:8px">${p&&p.submitted?'已提交总结':'完成证明：'}<span class="sp"></span>${own?(p&&p.submitted?'':`<span class="bl" onclick="A.submit('${date}')">⬆提交</span>`):`<span class="bl" onclick="A.rate('${fid}','${date}')">${p&&p.rating?'评分：'+'★'.repeat(p.rating):'给TA评分'}</span>`}</div>${own&&p&&p.rating?`<div class="or">搭友评分：${'★'.repeat(p.rating)}</div>`:''}</div>`}
function vPlan(){
 const tabs=`<div class="row" style="margin:6px 0"><b class="${S.ps==='fr'?'':'or'}" style="cursor:pointer" onclick="A.set('ps','mine')">我的</b><b class="${S.ps==='fr'?'or':''}" style="cursor:pointer" onclick="A.set('ps','fr')">搭友圈</b><span class="sp"></span><button class="btn" onclick="A.editPlan('${ymd(addD(new Date(),1))}')">明日计划＋</button></div>`;
 if(S.ps==='fr'){const out=S.fr.flatMap(id=>Object.entries((S.fd[id]||{}).plans||{}).map(([d,p])=>({id,d,p}))).sort((a,b)=>b.d.localeCompare(a.d));
  return `<div class="col">${tabs}${out.length?out.map(o=>`<h4>${esc(S.fd[o.id].p.name||'搭友')} · ${o.d.slice(5)}</h4>${planCard(o.d,o.p,false,o.id)}`).join(''):'<div class="empty">搭友还没有发布计划</div>'}</div>`}
 const days=Object.keys(S.d.plans||{}).sort().reverse();
 return `<div class="col">${tabs}${days.length?days.map(d=>`<h4>${d===ymd(new Date())?'今天':d} </h4>${planCard(d,plan(d),true)}`).join(''):'<div class="empty">这里收纳每一天的计划，点右上角制定明日计划</div>'}</div>`}
function vOkr(){
 const tabs=`<div class="row" style="margin:6px 0">${[['mine','我的'],['fr','搭友圈'],['arc','我的归档']].map(([k,n])=>`<b style="cursor:pointer;color:${S.os===k?'#000':'#aaa'}" onclick="A.set('os','${k}')">${n}</b>`).join('')}<span class="sp"></span><button class="btn" onclick="A.editGoal()">新目标＋</button></div>`;
 const card=(g,own,who)=>{const left=g.deadline?Math.ceil((new Date(g.deadline)-new Date(ymd(new Date())))/864e5):null;
  return `<div class="card">${who?`<div class="mu">${esc(who)}</div>`:''}<div class="row"><b class="sp">${esc(g.title)}</b>${own?`<span class="bl" onclick="A.editGoal('${g.id}')">…</span>`:''}</div>
  <div class="bar" style="margin:8px 0"><i style="width:${g.progress||0}%"></i></div><div class="mu">${g.deadline?`📅 ${g.deadline} 截止，${left>=0?'还剩'+left+'天':'已过期'}`:'无截止日'} · ${g.progress||0}%</div></div>`};
 let h='';
 if(S.os==='fr')h=S.fr.flatMap(id=>list((S.fd[id]||{}).goals).filter(g=>!g.arc).map(g=>card(g,false,S.fd[id].p.name))).join('')||'<div class="empty">搭友暂无目标</div>';
 else{const gs=list(S.d.goals).filter(g=>!!g.arc===(S.os==='arc'));h=gs.map(g=>card(g,true)).join('')||`<div class="empty">${S.os==='arc'?'没有归档':'设置阶段目标，倒数日会提醒你'}</div>`}
 return `<div class="col">${tabs}${h}</div>`}
function vHabit(){
 const ck=(S.d.checks||{})[S.date]||{};const hs=list(S.d.habits);
 const groups=['起床','晚上','睡前','任意时间'];
 return `<div class="col"><div class="row" style="margin:6px 0"><b>${S.date.slice(5).replace('-','月')}日</b><span class="sp"></span><b class="bl" style="font-size:26px" onclick="A.editHabit()">⊕</b></div>${weekStrip()}
 ${groups.map(g=>{const a=hs.filter(h=>h.time===g);return a.length?`<div class="mu" style="text-align:center">⌄ ${g}</div>`+a.map(h=>{const dn=ck[h.id];
  const cnt=h.freq==='week'?Object.entries(S.d.checks||{}).filter(([d,v])=>d>=ymd(mon(S.date))&&d<=ymd(addD(mon(S.date),6))&&v[h.id]).length:(dn?1:0),need=h.freq==='week'?h.per||1:1;
  return `<div class="hab ${dn?'dn':''}"><div class="ic">${esc(h.name[0])}</div><div style="cursor:pointer" onclick="A.editHabit('${h.id}')"><b>${esc(h.name)}</b><div class="mu">${cnt}/${need} 每${h.freq==='week'?'周':'天'}</div></div><span class="sp"></span><b>${streak(h.id)}d</b>${dn?`<div class="ok" onclick="A.check('${h.id}','${S.date}')">✓</div>`:`<span class="bl" onclick="A.check('${h.id}','${S.date}')">打卡</span>`}</div>`}).join(''):''}).join('')||'<div class="empty">点右上角 ⊕ 添加小习惯</div>'}</div>`}
function vCurve(){
 const N=14,pts=[];for(let i=N-1;i>=0;i--){const d=ymd(addD(new Date(),-i));pts.push([d,Math.round(sess(d,d).reduce((a,s)=>a+s.secs,0)/60)])}
 const mx=Math.max(60,...pts.map(p=>p[1])),W=320,H=170,x=i=>20+i*(W-40)/(N-1),y=v=>H-24-v/mx*(H-44);
 const avg=Math.round(pts.reduce((a,p)=>a+p[1],0)/N);
 return `<div class="col"><h4>近14天学习时长（分钟）</h4><div class="card"><svg viewBox="0 0 ${W} ${H}" width="100%"><polyline fill="none" stroke="#f59a0c" stroke-width="2.5" points="${pts.map((p,i)=>x(i)+','+y(p[1])).join(' ')}"/>${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p[1])}" r="3.5" fill="#f59a0c"/>${i%3==0||i==N-1?`<text x="${x(i)}" y="${H-6}" font-size="9" fill="#999" text-anchor="middle">${p[0].slice(5)}</text>`:''}`).join('')}</svg>
 <div class="row" style="justify-content:space-around;text-align:center"><div><b class="or" style="font-size:22px">${avg}</b><div class="mu">日均分钟</div></div><div><b class="or" style="font-size:22px">${Math.max(...pts.map(p=>p[1]))}</b><div class="mu">单日最高</div></div></div></div></div>`}
function vStudy(){
 const t=[['board','看板'],['plan','日计划'],['okr','目标OKR'],['hab','小习惯'],['curve','曲线']];
 const body={board:vBoard,plan:vPlan,okr:vOkr,hab:vHabit,curve:vCurve}[S.sub]();
 return [`<div class="top">${t.map(([k,n])=>`<a class="${S.sub===k?'on':''}" onclick="A.set('sub','${k}')">${n}</a>`).join('')}</div>`,body]}
function vBuddy(){
 const t=[['friends','搭友'],['msg','消息'],['int','互动']];
 let b='';
 if(S.fs==='friends')b=`<div class="row"><b class="sp">我的搭友(${S.fr.length})</b><button class="btn" onclick="A.addFriend()">＋ 添加搭友</button></div>`+(S.fr.map(id=>{const p=(S.fd[id]||{}).p||{};const live=p.focusing;return `<div class="card"><div class="row">${av(p)}<div class="sp"><b>${esc(p.name||'搭友')}</b> <span class="pill">私聊</span><div class="mu">累计已专注${fmt(p.total||0)}</div></div><span class="bl" onclick="A.chat('${id}')">私聊</span></div><div class="row mu" style="margin-top:8px"><span class="dot ${live?'live':''}"></span>${live?'正在专注「<b style=color:#000>'+esc(live)+'</b>」':'离线'}<span class="sp"></span><span class="bl" onclick="A.poke('${id}')">👊 催TA学习</span></div></div>`}).join('')||'<div class="empty">还没有搭友，把你的搭友码（在「我的」里）发给朋友，或输入对方的搭友码添加</div>');
 if(S.fs==='msg')b=S.fr.map(id=>{const p=(S.fd[id]||{}).p||{};return `<div class="card row" onclick="A.chat('${id}')" style="cursor:pointer">${av(p)}<b>${esc(p.name||'搭友')}</b><span class="sp"></span><span class="mu">进入聊天 ›</span></div>`}).join('')||'<div class="empty">添加搭友后即可聊天</div>';
 if(S.fs==='int')b=(S.inter||[]).map(i=>`<div class="card row">${av((S.fd[i.from]||{}).p||{})}<div class="sp"><b>${esc(((S.fd[i.from]||{}).p||{}).name||'搭友')}</b> ${esc(i.text)}<div class="mu">${new Date(i.ts).toLocaleString()}</div></div></div>`).join('')||'<div class="empty">还没有互动</div>';
 return [`<div class="top">${t.map(([k,n])=>`<a class="${S.fs===k?'on':''}" onclick="A.set('fs','${k}')">${n}</a>`).join('')}</div>`,`<div class="col">${b}</div>`]}
function vMe(){return ['<div class="top"><a class="on">我的</a></div>',`<div class="col"><div class="card row">${av({name:S.u.displayName,photo:S.u.photoURL})}<div><b>${esc(S.u.displayName)}</b><div class="mu">${esc(S.u.email)}</div></div></div><div class="card"><b>我的搭友码</b><div class="mu" style="word-break:break-all;margin:6px 0">${me()}</div><button class="btn" onclick="navigator.clipboard.writeText('${me()}');alert('已复制')">复制</button></div><div class="card"><button class="btn" onclick="auth.signOut()">退出登录</button></div></div>`]}
function vFind(){return ['<div class="top"><a class="on">操场</a></div>','<div class="col"><div class="empty">发现 / 操场（碎碎念广场）下一步接入</div></div>']}

function render(){const el=$('#app');
 if(!S.u){el.innerHTML=`<div class="login"><h1>搭子自习</h1><p class="mu">记录专注，和搭子互相监督</p><button class="btn f" style="font-size:17px;padding:10px 24px" onclick="A.login()">使用 Google 账号登录</button></div>`;return}
 const [top,body]=S.tab==='study'?vStudy():S.tab==='buddy'?vBuddy():S.tab==='me'?vMe():vFind();
 const nav=[['study','🎓','学习'],['buddy','💬','搭友'],['find','🧭','发现'],['me','👤','我的']];
 const inner=body.startsWith('<div class="side"')?body:`<div class="col">${body}</div>`.replace('<div class="col"><div class="col"','<div class="col"');
 const fabTxt=S.timer?fmtT(Math.floor((Date.now()-S.timer.t0)/1000)):(S.tab==='buddy'?'自习<br>连线':'开始<br>专注');
 const sc=document.querySelector('.main');const st=sc?sc.scrollTop:0;
 el.innerHTML=`${top}<div class="main">${inner}</div><button class="fab" id="fab" onclick="A.focus()">${fabTxt}</button><div class="nav">${nav.map(([k,i,n])=>`<a class="${S.tab===k?'on':''}" onclick="A.tab('${k}')"><b>${i}</b>${n}</a>`).join('')}</div>`;
 document.querySelector('.main').scrollTop=st}
const fmtT=s=>[Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(n=>String(n).padStart(2,'0')).join(':');

/* ---------- modal ---------- */
function modal(title,fields,ok,del){const m=$('#m');
 m.innerHTML=`<div class="sheet"><b style="font-size:17px">${title}</b>${fields.map(f=>`<div class="mu" style="margin-top:8px">${f.l}</div>`+(f.t==='area'?`<textarea id="f_${f.k}">${esc(f.v)}</textarea>`:f.t==='sel'?`<select id="f_${f.k}">${f.o.map(([v,n])=>`<option value="${v}" ${v==f.v?'selected':''}>${n}</option>`).join('')}</select>`:`<input id="f_${f.k}" type="${f.t||'text'}" value="${esc(f.v)}">`)).join('')}
 <div class="row" style="margin-top:8px"><button class="btn f" id="ok">保存</button><button class="btn" onclick="A.close()">取消</button><span class="sp"></span>${del?'<span class="bl" style="color:#e55" id="del">删除</span>':''}</div></div>`;
 m.classList.add('s');
 $('#ok').onclick=()=>{const v={};fields.forEach(f=>v[f.k]=$('#f_'+f.k).value);ok(v);A.close()};
 if(del)$('#del').onclick=()=>{del();A.close()}}

/* ---------- actions ---------- */
const A={
 close(){$('#m').classList.remove('s');$('#m').innerHTML='';A.cleanup&&A.cleanup()},
 login(){const p=new firebase.auth.GoogleAuthProvider();auth.signInWithPopup(p).catch(()=>auth.signInWithRedirect(p))},
 tab(k){S.tab=k;render()},set(k,v){S[k]=v;render()},
 shift(n){S.date=ymd(addD(S.date,n));render()},setDate(d){S.date=d;render()},
 check(h,d){const r=ref.child('checks/'+d+'/'+h);((S.d.checks||{})[d]||{})[h]?r.remove():r.set(true)},
 tick(d,i){const p=plan(d);ref.child('plans/'+d+'/items/'+i+'/done').set(!p.items[i].done)},
 submit(d){ref.child('plans/'+d+'/submitted').set(true)},
 editPlan(d){const p=plan(d);modal(d+' 计划（每行一项）',[{k:'t',l:'计划内容',t:'area',v:(p?.items||[]).map(i=>i.t).join('\n')}],v=>{
  const old=p?.items||[];const items=v.t.split('\n').map(s=>s.trim()).filter(Boolean).map(t=>({t,done:!!(old.find(o=>o.t===t)||{}).done}));
  ref.child('plans/'+d).update({items})},p?()=>ref.child('plans/'+d).remove():null)},
 rate(fid,d){const n=+prompt('给搭友评分 1-5');if(n>=1&&n<=5){db.ref('users/'+fid+'/plans/'+d+'/rating').set(n).then(loadF).catch(()=>alert('评分失败，请检查数据库规则'))}},
 editGoal(id){const g=id?S.d.goals[id]:{};modal(id?'编辑目标':'新目标',[{k:'title',l:'目标',v:g.title||''},{k:'deadline',l:'截止日期',t:'date',v:g.deadline||''},{k:'progress',l:'进度 %',t:'number',v:g.progress||0},{k:'arc',l:'状态',t:'sel',v:g.arc?1:0,o:[[0,'进行中'],[1,'归档']]}],v=>{
  if(!v.title)return;const o={title:v.title,deadline:v.deadline,progress:Math.min(100,+v.progress||0),arc:v.arc=='1'};id?ref.child('goals/'+id).update(o):ref.child('goals').push(o)},id?()=>ref.child('goals/'+id).remove():null)},
 editHabit(id){const h=id?S.d.habits[id]:{};modal(id?'编辑习惯':'新习惯',[{k:'name',l:'名称',v:h.name||''},{k:'time',l:'时段',t:'sel',v:h.time||'任意时间',o:['起床','晚上','睡前','任意时间'].map(x=>[x,x])},{k:'freq',l:'频率',t:'sel',v:h.freq||'day',o:[['day','每天'],['week','每周']]},{k:'per',l:'每周次数',t:'number',v:h.per||2}],v=>{
  if(!v.name)return;const o={name:v.name,time:v.time,freq:v.freq,per:+v.per||1};id?ref.child('habits/'+id).update(o):ref.child('habits').push(o)},id?()=>ref.child('habits/'+id).remove():null)},
 focus(){
  if(S.tab==='buddy'){alert('自习连线：邀请搭友同时开始专注，下一步接入');}
  const tags=[...new Set(['看课','书写','背诵','刷题',...list(S.d.sessions).map(s=>s.tag)])];let sel=tags[0];
  if(S.timer)return A.runTimer();
  const m=$('#m');m.innerHTML=`<div class="sheet"><b style="font-size:17px">开始专注</b><div class="tags">${tags.map((t,i)=>`<span class="${i?'':'on'}">${esc(t)}</span>`).join('')}</div><input id="nt" placeholder="或输入新的事项标签"><div class="row"><button class="btn f" id="go">开始</button><button class="btn" onclick="A.close()">取消</button></div></div>`;m.classList.add('s');
  m.querySelectorAll('.tags span').forEach(s=>s.onclick=()=>{m.querySelectorAll('.tags span').forEach(x=>x.classList.remove('on'));s.classList.add('on');sel=s.textContent;$('#nt').value=''});
  $('#go').onclick=()=>{const tag=$('#nt').value.trim()||sel;S.timer={tag,t0:Date.now()};db.ref('profiles/'+me()+'/focusing').set(tag);A.runTimer()}},
 runTimer(){const m=$('#m');m.innerHTML=`<div class="sheet" style="text-align:center"><div class="mu">正在专注「${esc(S.timer.tag)}」</div><div class="timer" id="tt"></div><div class="row"><button class="btn f sp" id="stop">结束并保存</button><button class="btn" onclick="A.close()">后台运行</button></div></div>`;m.classList.add('s');
  const tick=()=>{const s=Math.floor((Date.now()-S.timer.t0)/1000);const e=$('#tt');if(e)e.textContent=fmtT(s);const f=$('#fab');if(f)f.textContent=fmtT(s)};tick();const iv=setInterval(tick,1000);A.cleanup=()=>{clearInterval(iv);A.cleanup=null};
  $('#stop').onclick=async()=>{const secs=Math.floor((Date.now()-S.timer.t0)/1000),tag=S.timer.tag;S.timer=null;A.close();
   if(secs>=10)await ref.child('sessions').push({tag,secs,date:ymd(new Date()),ts:Date.now()});
   await db.ref('profiles/'+me()).transaction(p=>{p=p||{};p.total=(p.total||0)+(secs>=10?secs:0);if(p.weekKey!==wk()){p.weekKey=wk();p.weekSecs=0}p.weekSecs=(p.weekSecs||0)+(secs>=10?secs:0);p.focusing=null;p.last=Date.now();p.name=S.u.displayName;p.photo=S.u.photoURL||'';return p});
   S.myp=(await db.ref('profiles/'+me()).get()).val();render()}},
 addFriend(){modal('添加搭友',[{k:'c',l:'输入对方的搭友码',v:''}],async v=>{const id=v.c.trim();if(!id||id===me())return;
  const p=await db.ref('profiles/'+id).get();if(!p.exists())return alert('找不到该搭友码');
  await db.ref('friends/'+me()+'/'+id).set(true);await db.ref('friends/'+id+'/'+me()).set(true).catch(()=>{})})},
 poke(id){db.ref('interactions/'+id).push({from:me(),text:'催你去学习啦 👊',ts:Date.now()}).then(()=>alert('已发送'))},
 chat(id){const cid=[me(),id].sort().join('_'),r=db.ref('chats/'+cid).limitToLast(60),p=(S.fd[id]||{}).p||{};
  const m=$('#m');m.innerHTML=`<div class="sheet"><b>${esc(p.name||'搭友')}</b><div class="msgs" id="ms"></div><div class="row"><input id="mi" placeholder="说点什么…" style="margin:0"><button class="btn f" id="sd">发送</button></div></div>`;m.classList.add('s');
  const cb=r.on('child_added',s=>{const v=s.val(),d=document.createElement('div');d.className='msg'+(v.from===me()?' me':'');d.textContent=v.text;const b=$('#ms');if(b){b.appendChild(d);b.scrollTop=1e9}});
  A.cleanup=()=>{r.off('child_added',cb);A.cleanup=null};
  const send=()=>{const t=$('#mi').value.trim();if(!t)return;db.ref('chats/'+cid).push({from:me(),text:t,ts:Date.now()});$('#mi').value=''};$('#sd').onclick=send;$('#mi').onkeydown=e=>{if(e.key==='Enter')send()}}
};
$('#m').addEventListener('click',e=>{if(e.target.id==='m')A.close()});
render();
</script></body></html>
