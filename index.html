<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #111111;
            --text-muted: #666666;
            --border-color: #e0e0e0;
            --btn-bg: #111111;
            --btn-text: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 24px;
            position: relative;
        }

        .hidden { display: none !important; }

        /* ONBOARDING SLIDES */
        .slide { text-align: center; animation: fadeIn 0.3s ease-in-out; }
        
        .image-container {
            width: 100%;
            height: 260px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .slide h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .slide p {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
            padding: 0 10px;
        }

        .dots { display: flex; justify-content: center; gap: 6px; margin-bottom: 25px; }
        .dot { width: 6px; height: 6px; border-radius: 50%; background: #d0d0d0; transition: 0.3s; }
        .dot.active { background: var(--text-main); width: 20px; border-radius: 3px; }

        /* INPUTS & BUTTONS */
        .input-group { position: relative; margin-bottom: 16px; text-align: left; }
        .input-group label { display: block; font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        input, select {
            width: 100%;
            padding: 14px 16px;
            background: #fafafa;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 14px;
            transition: all 0.2s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--text-main);
            background: #ffffff;
            box-shadow: 0 0 0 2px rgba(0,0,0,0.05);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: var(--btn-bg);
            color: var(--btn-text);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.1s ease, opacity 0.2s;
            margin-top: 8px;
        }

        .btn-primary:hover { opacity: 0.9; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary:active { transform: scale(0.98); }

        .btn-google {
            width: 100%;
            padding: 12px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-main);
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 12px;
            transition: background 0.2s;
        }

        .btn-google:hover { background: #f5f5f5; }

        .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 14px; }
        .top-nav a { color: var(--text-muted); text-decoration: none; font-weight: 500; }
        .top-nav a:hover { color: var(--text-main); }

        .divider { text-align: center; color: var(--text-muted); font-size: 12px; margin: 20px 0; position: relative; }
        .divider::before, .divider::after { content: ""; position: absolute; top: 50%; width: 38%; height: 1px; background: var(--border-color); }
        .divider::before { left: 0; }
        .divider::after { right: 0; }

        .auth-switch { text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-muted); }
        .auth-switch a { color: var(--text-main); text-decoration: underline; font-weight: 600; }

        .error-msg { color: #d93838; font-size: 12px; text-align: center; margin-bottom: 15px; font-weight: 500; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
