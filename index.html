<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>学习搭子</title>
<style>
:root{--bg:#f7f4ed;--card:#fff;--bd:#eee8df;--or:#ff8c00;--tx:#333;--sub:#888;--ok:#52c41a;--bad:#ff4d4d}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1e1c19;--card:#2a2723;--bd:#3a362f;--tx:#eee;--sub:#aaa}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding-top:env(safe-area-inset-top,0);padding-bottom:calc(90px + env(safe-area-inset-bottom,0))}
button{font:inherit;cursor:pointer;color:inherit}
.wrap{max-width:440px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 18px rgba(0,0,0,.05)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sub{color:var(--sub);font-size:12px}
.tabs{display:flex;gap:18px;overflow-x:auto;padding:6px 14px;max-width:440px;margin:0 auto;position:sticky;top:env(safe-area-inset-top,0);background:var(--bg);z-index:5}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:6px 0;color:var(--sub);white-space:nowrap;font-size:14px}
.tabs button.on{color:var(--tx);font-weight:700;border-color:var(--or)}
.btn{background:var(--or);color:#fff;border:0;border-radius:14px;padding:12px;font-weight:600;width:100%}
.btn.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.tag{background:#fff3e0;color:var(--or);border:1px solid #ffe0b2;border-radius:10px;padding:4px 10px;font-size:11px;font-weight:600}
input,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:12px;font:inherit;font-size:14px;outline:none}
input:focus,textarea:focus{border-color:var(--or)}
.dates{display:flex;gap:8px;overflow-x:auto}
.d{flex:0 0 50px;height:66px;border-radius:18px;border:1px solid var(--bd);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--sub)}
.d b{font-size:15px;color:var(--tx)}.d.on{background:var(--or);border-color:var(--or);color:#fff}.d.on b{color:#fff}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--or)}
nav{position:fixed;left:0;right:0;bottom:0;max-width:440px;margin:0 auto;background:var(--bg);border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0));z-index:10}
nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--sub)}
nav button span{font-size:19px}nav button.on{color:var(--or);font-weight:700}
.fab{position:fixed;right:max(16px,calc(50% - 204px));bottom:calc(76px + env(safe-area-inset-bottom,0));width:54px;height:54px;border-radius:50%;background:var(--or);color:#fff;border:3px solid var(--bg);font-size:11px;font-weight:700;z-index:11;box-shadow:0 8px 20px rgba(255,140,0,.45)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal.h{display:none}
.box{background:var(--card);border-radius:24px;padding:24px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
.clock{font:800 54px monospace;text-align:center}
.msg{padding:8px 12px;border-radius:12px;max-width:80%;font-size:13px;background:var(--bg)}.msg.me{align-self:flex-end;background:var(--or);color:#fff}
.panel{display:none;flex-direction:column;gap:14px}.panel.on{display:flex}
.av{width:42px;height:42px;border-radius:50%;background:#ffe0b2;color:var(--or);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.hero{background:radial-gradient(circle at 20% 30%,#86b072 0,transparent 40%),radial-gradient(circle at 80% 65%,#5a874b 0,transparent 45%),#6f9a5e;color:#fff;padding:calc(18px + env(safe-area-inset-top,0)) 16px 16px;margin:-14px -14px 0;display:flex;flex-direction:column;gap:12px}
.hero .st{display:flex;text-align:center}.hero .st div{flex:1;font-size:11px;opacity:.9}.hero .st b{display:block;font-size:20px}
.hero .chip{background:rgba(255,255,255,.22);border-radius:14px;padding:4px 12px;font-size:12px;border:0;color:#fff}
.vip{background:#3b3a36;color:#f5deb3;margin:0 -14px;padding:14px 16px;display:flex;justify-content:space-between;font-size:14px}
.cats{display:flex;gap:16px;overflow-x:auto;padding:4px 0}.cats button{background:none;border:0;border-bottom:2px solid transparent;color:var(--sub);white-space:nowrap;padding-bottom:4px;font-size:14px;text-align:center}
.cats button small{display:block;font-size:10px}.cats button.on{color:var(--or);border-color:var(--or);font-weight:700}
.tl{display:flex;gap:10px}.tl .dt{width:44px;flex:none;font-size:12px;font-weight:600}.tl .dt small{display:block;color:var(--sub);font-weight:400;font-size:10px}
.bub{background:#c9b8f5;color:#333;border-radius:18px;padding:10px 14px;font-size:14px;align-self:flex-start}
select{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:12px;font:inherit;font-size:14px}
</style>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-database-compat.js"></script>
</head><body>

<div id="auth" class="modal"><div class="box">
<h2 style="text-align:center">🎓 学习搭子</h2>
<button class="btn g" onclick="gLogin()">🔵 使用 Google 登录</button>
<div class="sub" style="text-align:center">— 或使用邮箱密码 —</div>
<input id="em" type="email" placeholder="邮箱"><input id="pw" type="password" placeholder="密码（至少6位）"><input id="nm" placeholder="昵称（注册时填写）">
<div id="ae" class="sub" style="color:var(--bad)"></div>
<button class="btn" onclick="emailAuth(false)">登录</button><button class="btn g" onclick="emailAuth(true)">注册新账号</button>
<button class="btn g" onclick="resetPw()">忘记密码</button></div></div>

<div id="timer" class="modal h"><div class="box">
<div class="sub" style="text-align:center">专注自习中</div>
<div id="clk" class="clock">25:00</div>
<input id="subj" placeholder="学习科目，如：经济学">
<div class="row"><button class="btn g" id="pz" onclick="pauseT()">暂停</button><button class="btn g" onclick="setMin()">改时长</button><button class="btn g" id="nz" onclick="noise()">🎵 白噪音：关</button></div>
<button class="btn" style="background:var(--bad)" onclick="endT()">结束并打卡</button>
<button class="btn g" onclick="cancelT()">放弃</button></div></div>

<div id="form" class="modal h"><div class="box">
<h3 id="ft"></h3><input id="f1"><input id="f2" type="date" style="display:none"><select id="f3" style="display:none"><option>碎碎念</option><option>树洞</option><option>待办</option><option>搭友分享</option><option>向全世界叽叽喳喳</option></select>
<div class="row"><button class="btn g" onclick="$('form').classList.add('h')">取消</button><button class="btn" onclick="submitForm()">保存</button></div></div></div>

<div id="chat" class="modal h"><div class="box" style="height:420px">
<div class="row"><b id="cn"></b><button class="btn g" style="width:auto;padding:6px 12px" onclick="closeChat()">✕</button><button class="btn g" style="width:auto;padding:6px 12px" onclick="cam()">📹</button></div><video id="lv" autoplay muted playsinline style="display:none;width:100%;max-height:120px;border-radius:12px;background:#000"></video>
<div id="cm" style="flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px"></div>
<div class="row"><input id="ci" placeholder="发消息…" onkeydown="if(event.key==='Enter')sendC()"><button class="btn" style="width:70px" onclick="sendC()">发送</button></div></div></div>

<div id="top" class="tabs"></div>
<main class="wrap" id="main"></main>
<button class="fab" id="fab" onclick="fabClick()">▶<br>专注</button>
<nav id="nav"></nav>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const K='studybuddy_v1';
let S={user:null,logs:[],habits:[{n:'早起',c:'起床',done:{}},{n:'散步',c:'晚上',done:{}}],okrs:[],plans:{},posts:[
{id:1,a:'岁晏',t:'今天把睡眠状态调整过来了，太不容易了 🥲',likes:3,liked:false,d:'示例'}],chats:{},following:{}};
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const PEERS=[{n:'岁晏',f:'教资',r:'96%'},{n:'Alex',f:'数学与物理',r:'91%'},{n:'Chloe',f:'写作',r:'88%'},{n:'Ethan',f:'Python',r:'85%'}];
const REPLY=['加油！一起冲 💪','我也在学，等会儿打卡～','今天番茄钟完成几个了？','休息一下喝口水吧'];
const today=()=>new Date().toISOString().slice(0,10);
const fmt=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h}时${m}分`:`${m}分`};
let main='study',sub='看板',selDate=today();


function render(){
 if(S.user)$('auth').classList.add('h');
 const subs=['看板','日计划','目标','小习惯'];
 $('top').innerHTML=main==='study'?subs.map(s=>`<button class="${s===sub?'on':''}" onclick="sub='${s}';render()">${s}</button>`).join(''):
 `<button class="on">${{social:'搭友',square:'发现',me:'我的'}[main]}</button>`;
 $('nav').innerHTML=[['study','📚','学习'],['social','👥','搭友'],['square','🧭','发现'],['me','👤','我的']]
 .map(([k,i,t])=>`<button class="${k===main?'on':''}" onclick="main='${k}';render()"><span>${i}</span>${t}</button>`).join('');
 $('fab').innerHTML=main==='me'?'✎<br>记录想法':'▶<br>专注';
 $('main').innerHTML=({study:vStudy,social:vSocial,square:vSquare,me:vMe})[main]();
}

function vStudy(){
 if(sub==='看板'){
  const tot=S.logs.reduce((a,l)=>a+l.s,0);
  const days=[...Array(mon?30:7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return d});
  const dayLogs=S.logs.filter(l=>l.d===selDate);const dt=dayLogs.reduce((a,l)=>a+l.s,0);
  const by={};dayLogs.forEach(l=>by[l.sub]=(by[l.sub]||0)+l.s);
  const wk=days.map(d=>S.logs.filter(l=>l.d===d.toISOString().slice(0,10)).reduce((a,l)=>a+l.s,0));const mx=Math.max(...wk,1);
  return `<div class="card"><div class="row"><span>总计专注 <b>${fmt(tot)||'0分'}</b></span><span>记录 <b>${S.logs.length}</b> 次</span></div></div>
  <div class="dates">${days.map(d=>{const k=d.toISOString().slice(0,10);return `<div class="d ${k===selDate?'on':''}" onclick="selDate='${k}';render()"><span>${'日一二三四五六'[d.getDay()]}</span><b>${d.getDate()}</b></div>`}).join('')}</div>
  <div class="card"><b>日活动：${fmt(dt)||'0分'}</b>${Object.keys(by).map(k=>`<div class="row sub"><span>${esc(k)}</span><b style="color:var(--tx)">${fmt(by[k])}</b></div>`).join('')||'<div class="sub">当天还没有专注记录，点右下角“专注”开始</div>'}</div>
  <div class="card"><div class="row"><b>${mon?'月':'周'}统计</b><button class="tag" onclick="mon=!mon;render()">切换${mon?'周':'月'}报</button></div><div style="display:flex;align-items:flex-end;gap:8px;height:90px">${wk.map((v,i)=>`<div style="flex:1;text-align:center;font-size:10px;color:var(--sub)"><div style="height:${Math.max(v/mx*70,3)}px;background:var(--or);border-radius:6px 6px 0 0"></div>${days[i].getDate()}</div>`).join('')}</div></div>`+extra()}
 if(sub==='日计划'){
  const p=S.plans[selDate]||[];
  return `<div class="card"><div class="row"><b>${selDate} 计划</b><span class="tag" onclick="openForm('plan')">+ 添加</span></div>
  ${p.map((x,i)=>`<div class="row"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:auto" ${x.ok?'checked':''} onchange="togglePlan(${i})"><span style="${x.ok?'text-decoration:line-through;color:var(--sub)':''}">${esc(x.t)}</span></label><button class="tag" onclick="delPlan(${i})">删</button></div>`).join('')||'<div class="sub">还没有计划</div>'}
  ${proofHtml()}<div class="sub">完成 ${p.filter(x=>x.ok).length}/${p.length}</div></div>`}
 if(sub==='目标')return `<div class="row"><span class="sub">长效目标</span><span class="tag" onclick="openForm('okr')">+ 新建目标</span></div>`+
  (S.okrs.map((o,i)=>{const left=o.date?Math.ceil((new Date(o.date)-new Date())/864e5):null;
  return `<div class="card"><div class="row"><span class="sub">${o.date?`📅 ${o.date} 还剩 ${left} 天`:'无截止日期'}</span><button class="tag" onclick="delOkr(${i})">删</button></div><b>${esc(o.t)}</b><div class="bar"><i style="width:${o.p}%"></i></div><div class="row"><span class="sub">${o.p}%</span><div><button class="tag" onclick="okrStep(${i},-10)">−10</button> <button class="tag" onclick="okrStep(${i},10)">+10</button></div></div></div>`}).join('')||'<div class="card sub">还没有目标，点右上角新建</div>');
 const t=today();
 return `<div class="row"><span class="sub">每日小习惯</span><span class="tag" onclick="openForm('habit')">+ 新增</span></div><div class="card">`+
  S.habits.map((h,i)=>{const d=!!h.done[t];const st=Object.keys(h.done).length;return `<div class="row"><span>${esc(h.n)} <span class="sub">${esc(h.c)} · 累计${st}天</span></span><button class="tag" style="${d?'background:#f6ffed;color:var(--ok);border-color:#b7eb8f':''}" onclick="checkHabit(${i})">${d?'已完成 ✓':'打卡'}</button></div>`}).join('')+`</div>`;
}
function vSocial(){return PEERS.map((p,i)=>`<div class="card"><div class="row"><div class="row" style="justify-content:flex-start;gap:12px"><div class="av">${p.n[0]}</div><div><b>${p.n}</b><div class="sub" style="color:var(--or)">正在专注「${p.f}」</div><span class="tag">契合度 ${p.r}</span></div></div>
 <div><button class="tag" onclick="follow('${p.n}')">${S.following[p.n]?'已关注':'关注'}</button> <button class="tag" onclick="openChat('${p.n}')">私聊</button></div></div></div>`).join('')}
function vSquare(){return `<div class="row"><b>广场动态</b><span class="tag" onclick="openForm('post')">+ 发动态</span></div>`+
 S.posts.map((p,i)=>`<div class="card"><div class="row"><b>${esc(p.a)}</b><span class="sub">${p.d}</span></div><div style="background:#fff8f0;color:#333;padding:12px;border-radius:14px;font-size:13px">${esc(p.t)}</div>
 <div class="row sub"><button class="tag" onclick="like(${i})">${p.liked?'❤️':'👍'} ${p.likes}</button>${p.mine?`<button class="tag" onclick="delPost(${i})">删除</button>`:''}</div></div>`).join('')}
let tcat='全部';
const CATS=[['搭友分享','搭友圈'],['向全世界叽叽喳喳','公开'],['待办','搭友圈'],['碎碎念','私密'],['树洞','私密']];
function dl(ts){const d=new Date(ts),n=new Date(new Date().toDateString()),k=Math.round((n-new Date(d.toDateString()))/864e5);
 return `${k===0?'今天':k===1?'昨天':k===2?'前天':'周'+'日一二三四五六'[d.getDay()]}<small>${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}</small>`}
function vMe(){const u=S.user;if(!u)return '';
 const th=Object.entries(THOUGHTS).map(([k,v])=>({k,...v})).sort((a,b)=>b.ts-a.ts);
 const list=tcat==='全部'?th:th.filter(x=>x.cat===tcat);const tags=PROF.tags||[];
 const hd=`<div class="hero"><div class="row"><span></span><button class="chip" onclick="openForm('name')">✎ 昵称</button></div>
 <div class="row" style="justify-content:flex-start;gap:12px"><div style="background:#fff;border-radius:16px;padding:8px 12px;font-size:30px;transform:rotate(-2deg)">🐱🐰🐻</div><div><b style="font-size:18px">${esc(u.name)}</b><div><span class="chip">1.初级学员</span></div></div></div>
 <div class="st"><div><b>${Object.keys(S.following).length}</b>关注</div><div><b>${th.length}</b>想法</div><div><b>${S.logs.length}</b>专注</div><div><b>${S.habits.reduce((a,h)=>a+Object.keys(h.done).length,0)}</b>打卡</div><div><b>${S.posts.filter(p=>p.mine).reduce((a,p)=>a+p.likes,0)}</b>我的赞</div></div>
 <div style="font-size:13px;cursor:pointer" onclick="openForm('quote')">❝ ${esc(PROF.quote||'想，全是问题；做，都是答案（点击修改）')}</div>
 <div style="display:flex;gap:8px;flex-wrap:wrap">${tags.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}<button class="chip" onclick="openForm('tag')">+ 标签</button></div></div>
 <div class="vip"><b>👑 会员中心</b><span style="font-size:12px">开通即享连线等多重特权 ›</span></div>`;
 const cats=`<div class="cats"><button class="${tcat==='全部'?'on':''}" onclick="tcat='全部';render()">全部<small>${th.length}个想法</small></button>`+CATS.map(c=>`<button class="${tcat===c[0]?'on':''}" onclick="tcat='${c[0]}';render()">${c[0]}<small>${c[1]}</small></button>`).join('')+'</div>';
 const items=`<div class="bub">今天发生了什么新鲜事？</div>`+list.map(x=>`<div class="tl"><div class="dt">${dl(x.ts)}</div><div class="card" style="flex:1"><div class="sub" style="text-align:right">${esc(x.cat)}（${(CATS.find(c=>c[0]===x.cat)||[,''])[1]}）</div><div style="font-size:14px;white-space:pre-wrap">${esc(x.t)}</div><div class="row sub"><span>${new Date(x.ts).toTimeString().slice(0,5)}</span><button class="tag" onclick="delThought('${x.k}')">删除</button></div></div></div>`).join('');
 let adm='';
 if(isAdmin){adm=`<div class="card"><b>🛡 管理员 · 用户管理</b>`+Object.entries(USERS).map(([id,x])=>{const b=!!BANS[id],me=id===u.uid;return `<div class="row"><div style="min-width:0"><div>${esc(x.name||'?')} <span class="sub">${esc(x.email||'')}</span></div><div class="sub">最近：${x.lastSeen?new Date(x.lastSeen).toLocaleString():'-'}</div></div>${me?'<span class="tag">我</span>':`<button class="tag" style="${b?'':'background:#fff2f0;color:var(--bad);border-color:#ffccc7'}" onclick="kick('${id}',${b})">${b?'解封':'踢出'}</button>`}</div>`}).join('')+`</div>`}
 return hd+cats+items+adm+`<button class="btn g" onclick="logout()">退出登录</button>`}
function delThought(k){if(confirm('删除这条想法？'))db.ref('thoughts/'+S.user.uid+'/'+k).remove()}
function kick(id,b){if(!confirm(b?'解封该用户？':'踢出该用户？对方会被立即登出且无法再登录'))return;(b?db.ref('banned/'+id).remove():db.ref('banned/'+id).set({by:S.user.email,at:Date.now()})).catch(e=>alert('失败：'+e.message))}
function fabClick(){main==='me'?openForm('thought'):startT()}

/* forms */
let fm=null;
function openForm(t){fm=t;const m={plan:['添加计划','计划内容'],okr:['新建目标 (OKR)','核心目标'],habit:['新增习惯','习惯名称'],post:['发布动态','今天有什么心得？'],thought:['记录想法','今天发生了什么新鲜事？'],name:['修改昵称','昵称'],quote:['修改签名','想，全是问题；做，都是答案'],tag:['添加标签','如：大学']}[t];
 $('ft').textContent=m[0];$('f1').placeholder=m[1];$('f1').value=t==='name'?S.user.name:t==='quote'?(PROF.quote||''):'';$('f2').value='';$('f2').style.display=t==='okr'?'block':'none';$('f3').style.display=t==='thought'?'block':'none';$('form').classList.remove('h');setTimeout(()=>$('f1').focus(),50)}
function submitForm(){const v=$('f1').value.trim();if(!v)return;
 if(['thought','name','quote','tag'].includes(fm)){const uid=S.user.uid,ur=db.ref('users/'+uid);let p;
  if(fm==='thought')p=db.ref('thoughts/'+uid).push({t:v,cat:$('f3').value,ts:Date.now()});
  if(fm==='name'){S.user.name=v;ME.updateProfile({displayName:v});p=ur.update({name:v})}

/* timer */
let T={left:1500,total:1500,id:null,run:false,start:0};
function paintT(){$('clk').textContent=String(Math.floor(T.left/60)).padStart(2,'0')+':'+String(T.left%60).padStart(2,'0')}
function tick(){T.left--;paintT();if(T.left<=0){endT(true)}}
function startT(){if(!S.user)return;$('timer').classList.remove('h');if(!T.run&&T.left===T.total&&!T.id){runT()}}
function runT(){clearInterval(T.id);T.run=true;$('pz').textContent='暂停';T.id=setInterval(tick,1000)}
function pauseT(){if(T.run){clearInterval(T.id);T.run=false;$('pz').textContent='继续'}else runT()}
function setMin(){const m=parseInt(prompt('专注分钟数（1-180）',T.total/60),10);if(m>0&&m<=180){T.total=T.left=m*60;paintT()}}
function resetT(){if(NS)noise();clearInterval(T.id);T.id=null;T.run=false;T.left=T.total;paintT();$('timer').classList.add('h')}
function cancelT(){if(T.left===T.total||confirm('放弃本次专注？不会记录'))resetT()}
function endT(done){const s=T.total-T.left;clearInterval(T.id);
 if(s>=10){S.logs.push({d:today(),s,sub:$('subj').value.trim()||'未命名',at:Date.now()});save()}
 if(done)alert('🎉 完成一个专注周期！');resetT();render()}
paintT();S.user=null;render();

 NS=NC.createBufferSource();NS.buffer=buf;NS.loop=true;const g=NC.createGain();g.gain.value=.15;NS.connect(g);g.connect(NC.destination);NS.start();b.textContent='🎵 白噪音：开'}

function upProof(el){const f=el.files[0];if(!f)return;if(f.size>10*1024*1024)return alert('图片不能超过10MB');
 const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,480/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
 S.proof=S.proof||{};S.proof[selDate]=c.toDataURL('image/jpeg',.7);save();render()};im.src=r.result};r.readAsDataURL(f)}
